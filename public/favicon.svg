<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="beaconGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Outer Radar Pulse Rings -->
  <circle cx="32" cy="32" r="23" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="16" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Directional Navigation Arrow (Traccar Telematics Arrow) -->
  <g filter="url(#glow)">
    <path
      d="M32 12L46 44L32 38L18 44L32 12Z"
      fill="url(#cyanTeal)"
    />
    <!-- Inner Accent -->
    <path
      d="M32 17L40 39L32 35L24 39L32 17Z"
      fill="#083344"
      fill-opacity="0.5"
    />
    <!-- Center GPS Pin Core -->
    <circle cx="32" cy="29" r="3.5" fill="#FFFFFF" />
    <circle cx="32" cy="29" r="1.5" fill="#0891B2" />
  </g>

  <!-- Signal Beacons Top Right -->
  <circle cx="48" cy="14" r="3" fill="#10B981" />
  <circle cx="48" cy="14" r="5" stroke="#10B981" stroke-width="1" stroke-opacity="0.6" />
</svg>